name: ZAP Security Scan
on:
  push:
    branches: [ main, develop ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the Notes App
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar la App con Docker Compose
        run: |
          docker compose up -d --build
          echo "Esperando a que la Notes App levante..."
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "¡App lista para escanear!"
              exit 0
            fi
            echo "Esperando... ($i/30)"
            sleep 2
          done
          exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-I'
          allow_issue_writing: false
          # ESTO ES LO QUE FALTA: Evitamos que ZAP suba el artifact (lo hacemos nosotros abajo)
          artifact_name: ''

      - name: Subir Reporte de Vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: report_html.html
          retention-days: 7
