name: ZAP Security Scan
on:
  push:
    branches: [ main, develop ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the Notes App
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar la App con Docker Compose
        run: |
          docker compose up -d --build
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "¡App lista!"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: ZAP Scan (Automation Framework)
        run: |
          mkdir -p reports
          chmod -R 777 reports
          
          # Usamos la ruta absoluta del workspace de GitHub para el volumen
          docker run --rm -v ${{ github.workspace }}:/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/.zap/zap-plan.yml -P 8090

      - name: Subir Reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: reports/
