env:
  contexts:
    - name: NotesApp
      urls:
        - http://localhost
      includePaths:
        - http://localhost.*

jobs:
  - type: spider
    parameters:
      context: NotesApp
      maxDuration: 2

  - type: passiveScan-wait

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/
      reportFile: zap-report.html
